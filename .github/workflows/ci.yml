name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Stable on purpose: this string is the required status check in the
    # branch ruleset. Adding a gate must not rename the job, or main becomes
    # unmergeable until the ruleset is edited to match.
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # app/.fvmrc is the single source of truth for the SDK version, so a
      # workstation and the runner can never drift apart.
      - name: Read pinned Flutter version
        id: pin
        run: echo "version=$(jq -er .flutter app/.fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # The .arb files are the source of truth; the generated Dart is not
      # committed, so it has to be produced before anything analyses it.
      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n

      - name: Format gate
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze gate
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Design-token gate
        working-directory: app
        run: dart run ../tool/check_design_tokens.dart

      - name: Architecture gate
        working-directory: app
        run: dart run ../tool/check_architecture.dart

      - name: Encoding gate
        working-directory: app
        run: dart run ../tool/check_encoding.dart

      # Goldens are excluded: text rasterisation differs between a Windows
      # workstation and this Linux runner, so byte comparison would fail for
      # reasons unrelated to the code. They are a local review artifact.
      - name: Test
        working-directory: app
        run: flutter test --exclude-tags golden
