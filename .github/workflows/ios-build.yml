name: iOS build

# Deliberately NOT on every pull request. macOS runners bill at 10x the
# minute rate on private repositories, so this runs when main moves and on
# demand. It is also not a required status check — a broken iOS build must
# be visible, but it must not block a repository that has no Mac to fix it on.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ios build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Flutter version
        id: pin
        run: echo "version=$(jq -er .flutter app/.fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n

      # Drift tables and other build_runner output. Not committed, same
      # reasoning as the localisations above. It was missing here while the
      # quality-gates job had it, so this job was compiling against source that
      # does not exist — on its own enough to fail every run.
      - name: Generate code
        working-directory: app
        run: dart run build_runner build

      # Simulator, not device. Every device build here has ended at Flutter's
      # "requires a selected Development Team" message despite --no-codesign,
      # and no runner has a team. The simulator slice compiles the same Dart,
      # the same plugins and the same Swift Packages, which is the whole
      # question this job exists to answer, and it never asks to be signed.
      # Running on a physical iOS device stays an open debt; see
      # docs/11-foundation-plan.md.
      - name: Build for the iOS simulator
        working-directory: app
        run: flutter build ios --simulator --debug
