org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off.
#
# On Windows it fails reproducibly with "Could not close incremental caches",
# even from a clean build tree: the compile daemon cannot release its .tab
# cache files, usually because a virus scanner is holding them. The failure
# surfaces as a long Kotlin stack trace that reads like a code fault and is
# not one.
#
# The cost is rebuild speed on the plugin modules, which for this project is
# seconds. The benefit is that a build either works or fails for a real
# reason. Revisit if Android builds become slow enough to matter.
kotlin.incremental=false
