name: wanderlock
description: "Gamified sightseeing map: visit a place once, unlock it for every lens."
# Private app, never published to pub.dev.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Keep alphabetical: the sort_pub_dependencies lint is a CI gate.
# Runtime packages arrive with the phase that needs them (supabase_flutter and
# drift in F2, maplibre_gl in F3).
dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  geolocator: ^14.0.3
  go_router: ^17.3.0
  # `any`, not a caret range: flutter_localizations pins intl exactly, so any
  # constraint of ours would just fight the SDK on every Flutter upgrade.
  intl: any
  maplibre_gl: ^0.26.2
  supabase_flutter: ^2.17.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  # Bundled, never fetched at runtime: the app must work offline, and a first
  # launch without a network would fall back to a system font and break layout.
  assets:
    # Pilot content, bundled so a first launch with no network still has a map
    # to draw. Kept identical to the root content/ file by a test.
    - assets/content/checkpoints.json
    # The v1 quest route. Named file by file rather than by directory, like
    # the line above: a directory entry would also ship anything a future
    # experiment leaves in there.
    - assets/content/quest-routes.json
    # Clay icons, CC0 from 3dicons.co. Only what a screen uses is bundled; the
    # full 120-icon set lives in content/icons/. See content/icon-licenses.md.
    - assets/icons/
    # Cartoon building stickers for the twelve places. Provisional art from
    # the sticker pass; sources in content/landmarks/.
    - assets/landmarks/
    - assets/fonts/OFL-BeVietnamPro.txt
    - assets/fonts/OFL-Baloo2.txt

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # google/fonts ships Baloo 2 only as a variable font, with no static
    # instances. One asset, weight picked on the wght axis in app_typography.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
